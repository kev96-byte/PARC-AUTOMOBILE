controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

vehicule_etat:
    path: /vehicule/etat
    controller: App\Controller\VehiculeController::etat

assurance.index:
    path: /assurance
    controller: App\Controller\AssuranceController::index

visite.index:
    path: /visite
    controller: App\Controller\VisiteController::index

api_available_vehicles_and_drivers:
    path: /api/available-vehicles-and-drivers
    controller: App\Controller\DemandeController::availableVehiclesAndDrivers
    methods: ['POST']

# config/routes.yaml
base_view:
    path: /base-view
    controller: App\Controller\DemandeController::renderBaseView

home:
    path: /
    controller: App\Controller\HomeController::index

# Route pour gérer les erreurs 404
error404:
    path: /error404
    controller: App\Controller\ErrorController::show

# Ajoutez cette ligne pour gérer toutes les autres routes non définies
app.swagger_ui:
    path: /{any}
    controller: App\Controller\ErrorController::show
    requirements:
        any: .*
